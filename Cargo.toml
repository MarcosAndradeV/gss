[package]
name = "gss"
version = "0.2.0"
edition = "2024"
exclude = ["editors", "tree-sitter-gss"]
license = "MIT"
description = "A lightweight, expressive stylesheet and declarative object configuration language with class queries and live hot-reloading"
repository = "https://github.com/MarcosAndradeV/GSS"

[dependencies]
lex-just-parse = { version = "1.3.1", features = ["interning"] }
notify = { version = "8.2.0", optional = true }
lsp-server = { version = "0.10.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }

[features]
default = ["interning", "watch"]
watch = ["dep:notify"]
lazy = []
interning = ["lex-just-parse/interning"]
lsp = ["dep:lsp-server", "dep:serde", "dep:serde_json"]

[[bin]]
name = "gss_test"
path = "src/bin/main.rs"

[[bin]]
name = "gss-fmt"
path = "src/bin/gss-fmt.rs"

[[bin]]
name = "gss-lsp"
path = "src/bin/gss-lsp.rs"
required-features = ["lsp"]

[[test]]
name = "test_gss_fmt"
path = "tests/test_gss_fmt.rs"

[[test]]
name = "test_gss_lsp"
path = "tests/test_gss_lsp.rs"
required-features = ["lsp"]

[[test]]
name = "test_lazy_gss"
path = "tests/test_lazy_gss.rs"
required-features = ["lazy"]
